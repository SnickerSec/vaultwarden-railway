[build]
builder = "dockerfile"
dockerfilePath = "monitor/Dockerfile"
watchPatterns = ["monitor/**"]

[deploy]
startCommand = "gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 app:app"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
