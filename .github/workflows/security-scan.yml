name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Wednesdays at 3 AM UTC
    - cron: '0 3 * * 3'

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build monitor image
        run: docker build -t vaultwarden-monitor:scan -f monitor/Dockerfile monitor/

      - name: Run Trivy on monitor image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'vaultwarden-monitor:scan'
          format: 'sarif'
          output: 'trivy-monitor.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-monitor.sarif'
          category: 'trivy-monitor'


  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r monitor/requirements.txt

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: monitor/requirements.txt
